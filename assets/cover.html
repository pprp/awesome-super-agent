<!doctype html>
<!--
  Render (needs network for Google Fonts):
  "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=1280,320 --virtual-time-budget=8000 \
    --screenshot="$PWD/assets/cover.png" "file://$PWD/assets/cover.html"
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Awesome Super Agent — banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #0A0D14;
    --paper: #EDEAE2;
    --mute: #8A91A3;
    --blue: #4D6BFE;
    --amber: #FFB020;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 320px; background: var(--ink); }

  #cover {
    position: relative;
    width: 1280px;
    height: 320px;
    overflow: hidden;
    color: var(--paper);
    font-family: "JetBrains Mono", monospace;
    background:
      radial-gradient(circle at 170px 160px, rgba(77, 107, 254, 0.22), transparent 260px),
      radial-gradient(rgba(237, 234, 226, 0.10) 1px, transparent 1.2px) 0 0 / 22px 22px,
      var(--ink);
  }

  .rings { position: absolute; left: 0; top: 0; }

  .mark {
    position: absolute;
    left: 85px;
    top: 75px;
    width: 170px;
    height: 170px;
    filter: drop-shadow(0 0 30px rgba(77, 107, 254, 0.35));
  }

  .copy {
    position: absolute;
    left: 318px;
    top: 50%;
    transform: translateY(-50%);
  }
  .kicker {
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .kicker b { color: var(--amber); font-weight: 500; }
  h1 {
    margin-top: 10px;
    font-family: "Instrument Serif", serif;
    font-weight: 400;
    font-size: 80px;
    line-height: 1;
    letter-spacing: -0.015em;
    white-space: nowrap;
  }
  h1 .aw { font-style: italic; color: var(--blue); letter-spacing: 0; }
  .zh {
    margin-top: 14px;
    font-family: "Noto Serif SC", serif;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.04em;
  }
  .zh em { font-style: normal; color: var(--amber); }

  .side {
    position: absolute;
    right: 48px;
    top: 50%;
    transform: translateY(-50%);
    width: 284px;
    padding-left: 32px;
    border-left: 1px solid rgba(237, 234, 226, 0.12);
    font-size: 15px;
  }
  .modes {
    display: flex;
    border: 1px solid rgba(237, 234, 226, 0.2);
    border-radius: 999px;
    padding: 4px;
  }
  .modes span {
    flex: 1;
    text-align: center;
    padding: 6px 0;
    border-radius: 999px;
    color: var(--mute);
  }
  .modes .on { background: var(--blue); color: #fff; font-weight: 500; }
  .flow {
    margin-top: 20px;
    list-style: none;
    color: var(--mute);
    line-height: 1.75;
  }
  .flow li::before { content: "→ "; color: var(--blue); }
  .flow li:first-child::before { content: none; }
  .flow .at { color: var(--amber); font-weight: 700; }
  .flow .pr { color: var(--paper); font-weight: 500; }
</style>
</head>
<body>
<div id="cover">
  <svg class="rings" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
    <g stroke="rgba(237,234,226,0.08)" stroke-width="1">
      <circle cx="170" cy="160" r="118"/>
      <circle cx="170" cy="160" r="160" stroke-dasharray="2 6"/>
      <circle cx="170" cy="160" r="215"/>
    </g>
    <path d="M170 42 A118 118 0 0 1 272.2 101" stroke="#4D6BFE" stroke-width="2" stroke-linecap="round"/>
    <circle cx="272.2" cy="101" r="3.5" fill="#FFB020"/>
  </svg>

  <svg class="mark" viewBox="0 0 120 120" fill="none">
    <circle cx="60" cy="60" r="17" stroke="#4D6BFE" stroke-width="10"/>
    <path d="M77 42V66a9.5 9.5 0 0 0 19 0V60A36 36 0 1 0 82.2 88.4" stroke="#4D6BFE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="6" fill="#FFB020"/>
  </svg>

  <div class="copy">
    <div class="kicker">DeepSeek Harness · <b>dsh-superagent</b></div>
    <h1><span class="aw">Awesome</span> Super Agent</h1>
    <p class="zh">想了解 Super-agent，<em>从这里开始</em>。</p>
  </div>

  <div class="side">
    <div class="modes"><span>off</span><span class="on">observe</span><span>auto</span></div>
    <ul class="flow">
      <li class="at">@mention</li>
      <li>Trigger · Eval · Ticket</li>
      <li class="pr">Pull Request</li>
    </ul>
  </div>
</div>
</body>
</html>
